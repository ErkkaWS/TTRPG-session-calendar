# Optional logrotate config to keep bot.log tidy long-term.
#
# Install:
#   sudo cp logrotate.conf /etc/logrotate.d/session-scheduler
#   (edit the path below to match your install directory first)
#
# Test without making changes:
#   sudo logrotate -d /etc/logrotate.d/session-scheduler

/path/to/session-scheduler/bot.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    size 5M
}
